events {}
http {
  server {
    listen 80;

    location = /users/health    { proxy_pass http://user-service:8001/health; }
    location = /products/health { proxy_pass http://product-service:8002/health; }
    location = /orders/health   { proxy_pass http://order-service:8003/health; }

    location /users    { proxy_pass http://user-service:8001; }
    location /products { proxy_pass http://product-service:8002; }
    location /orders   { proxy_pass http://order-service:8003; }

    location = /health { return 200 'ok'; }
  }
}
