services:
  user-service:
    build: ./user-service
    image: ${ECR:-local}/user-service:${TAG:-dev}
    restart: unless-stopped
    networks: [appnet]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  product-service:
    build: ./product-service
    image: ${ECR:-local}/product-service:${TAG:-dev}
    restart: unless-stopped
    networks: [appnet]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  order-service:
    build: ./order-service
    image: ${ECR:-local}/order-service:${TAG:-dev}
    restart: unless-stopped
    environment:
      USER_SERVICE_URL: http://user-service:8001
      PRODUCT_SERVICE_URL: http://product-service:8002
    depends_on:
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
    networks: [appnet]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.25-alpine
    ports: ["80:80"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - user-service
      - product-service
      - order-service
    restart: unless-stopped
    networks: [appnet]

networks:
  appnet:
    driver: bridge
